<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>George Usanetashvili - Volkov Commander VVC</title>
    <style>
        :root { --vc-blue: #0000aa; --vc-cyan: #00aaaa; --vc-white: #ffffff; --vc-yellow: #ffff00; }
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; user-select: none; }

        /* Top Menu */
        .top-menu { background: var(--vc-cyan); color: #000; display: flex; padding: 2px; border-bottom: 2px solid #fff; }
        .menu-item { padding: 0 15px; font-weight: bold; cursor: pointer; position: relative; }
        .menu-item:hover { background: #fff; }
        .dropdown { display: none; position: absolute; top: 100%; left: 0; background: var(--vc-cyan); border: 2px solid #fff; min-width: 200px; z-index: 1000; box-shadow: 8px 8px #000; }
        .menu-item:hover .dropdown { display: block; }
        .dropdown-link { display: block; padding: 4px 10px; color: #000; text-decoration: none; border-bottom: 1px solid #444; font-size: 13px; }
        .dropdown-link:hover { background: #fff; }

        /* Container 30/70 */
        .container { display: grid; grid-template-columns: 30% 70%; height: calc(100vh - 55px); }
        .pane { background: var(--vc-blue); border: 1px solid #fff; display: flex; flex-direction: column; }
        .pane-header { background: var(--vc-cyan); color: #000; text-align: center; font-weight: bold; padding: 2px; font-size: 12px; }

        /* Navigation List */
        .file-list { flex-grow: 1; overflow-y: auto; padding: 5px; outline: none; }
        .file-item { cursor: pointer; padding: 2px 5px; white-space: nowrap; }
        .selected-file { background: var(--vc-cyan); color: #000; font-weight: bold; }
        .protected { color: var(--vc-yellow); } /* Visual hint for non-editable files */

        /* Volkov Blue Editor */
        #editor-container { flex-grow: 1; background: var(--vc-blue); display: flex; flex-direction: column; padding: 10px; }
        #viewer { flex-grow: 1; background: var(--vc-blue); color: var(--vc-cyan); border: 2px inset var(--vc-cyan); font-size: 18px; outline: none; resize: none; padding: 10px; font-family: 'Courier New'; }
        #jitsi-frame { flex-grow: 1; display: none; border: none; background: #000; }

        /* F-Bar */
        .f-bar { display: grid; grid-template-columns: repeat(10, 1fr); background: #000; height: 25px; position: fixed; bottom: 0; width: 100%; }
        .f-btn { font-size: 11px; text-align: center; border-right: 1px solid #333; cursor: pointer; line-height: 25px; }
        .f-num { font-weight: bold; color: #fff; }
        .f-txt { background: var(--vc-cyan); color: #000; padding: 0 4px; }
    </style>
</head>
<body onkeydown="handleGlobalKeys(event)">

<div class="top-menu">
    <div class="menu-item">Left
        <div class="dropdown">
            <a href="#" class="dropdown-link" onclick="sortFiles()">Sort by Name</a>
        </div>
    </div>
    <div class="menu-item">File
        <div class="dropdown">
            <a href="#" class="dropdown-link" onclick="showHelp()">F1 Help</a>
            <a href="#" class="dropdown-link" onclick="saveFile()">F2 Save</a>
            <a href="#" class="dropdown-link" onclick="executeFile()">F3 View</a>
            <a href="#" class="dropdown-link" onclick="editMode()">F4 Edit</a>
            <a href="#" class="dropdown-link">F5 Copy</a>
            <a href="#" class="dropdown-link">F6 RenMov</a>
            <a href="#" class="dropdown-link" onclick="createNewDir()">F7 Mkdir</a>
            <a href="#" class="dropdown-link" onclick="deleteFile()">F8 Delete</a>
            <a href="#" class="dropdown-link">F9 Menu</a>
            <a href="#" class="dropdown-link" onclick="location.reload()">F10 Quit</a>
            <a href="#" class="dropdown-link" onclick="createNewFile()">Shift-F4 New File</a>
        </div>
    </div>
    <div class="menu-item">Network</div><div class="menu-item">View</div><div class="menu-item">Disk</div><div class="menu-item">Setup</div><div class="menu-item">Utility</div>
</div>

<div class="container">
    <div class="pane">
        <div class="pane-header">C:\GEORGIA\INVENTORS</div>
        <div class="file-list" id="file-list"></div>
    </div>
    <div class="pane">
        <div class="pane-header" id="view-header">VOLKOV EDITOR (MCEDIT)</div>
        <div id="editor-container">
            <textarea id="viewer" spellcheck="false" placeholder="Select file and press F3/F4..."></textarea>
            <iframe id="jitsi-frame"></iframe>
        </div>
    </div>
</div>

<div class="f-bar">
    <div class="f-btn" onclick="showHelp()"><span class="f-num">1</span><span class="f-txt">Help</span></div>
    <div class="f-btn" onclick="saveFile()"><span class="f-num">2</span><span class="f-txt">Save</span></div>
    <div class="f-btn" onclick="executeFile()"><span class="f-num">3</span><span class="f-txt">View</span></div>
    <div class="f-btn" onclick="editMode()"><span class="f-num">4</span><span class="f-txt">Edit</span></div>
    <div class="f-btn"><span class="f-num">5</span><span class="f-txt">Copy</span></div>
    <div class="f-btn"><span class="f-num">6</span><span class="f-txt">RenMov</span></div>
    <div class="f-btn" onclick="createNewDir()"><span class="f-num">7</span><span class="f-txt">MkDir</span></div>
    <div class="f-btn" onclick="deleteFile()"><span class="f-num">8</span><span class="f-txt">Delete</span></div>
    <div class="f-btn"><span class="f-num">9</span><span class="f-txt">Menu</span></div>
    <div class="f-btn" onclick="location.reload()"><span class="f-num">10</span><span class="f-txt">Quit</span></div>
</div>

<script>
    /* George Engine VVC - Protected System Files */
    let fs = JSON.parse(localStorage.getItem('george_vvc_v4')) || [
        { name: 'ABOUT_US.txt', content: 'We are yang inventors group motivated to improve technology and make life more easy using innovations and smart robots.', type: 'txt', protected: true },
        { name: 'CONTACT.txt', content: 'Georgia Pankisi, Duisi. tel: +995 598 080078.', type: 'txt', protected: true },
        { name: 'LIVE_CLASS.exe', content: 'https://meet.jit.si/GeorgeUsanetashviliClass', type: 'exe' },
        { name: 'DOWNLOADS', type: 'dir' },
        { name: 'Robot_Manual.zip', content: 'robot_manual.zip', type: 'zip' } // Logic for real download
    ];
    let sel = 0;

    function render() {
        const list = document.getElementById('file-list');
        list.innerHTML = '';
        fs.forEach((f, i) => {
            const div = document.createElement('div');
            div.className = 'file-item ' + (i === sel ? 'selected-file ' : '') + (f.protected ? 'protected' : '');
            div.innerText = f.type === 'dir' ? `[${f.name}]` : f.name;
            div.onclick = () => { sel = i; render(); };
            div.ondblclick = () => { sel = i; editMode(); };
            list.appendChild(div);
        });
    }

    function handleGlobalKeys(e) {
        if (document.activeElement.id === 'viewer') {
            if(e.key === "F2") { saveFile(); e.preventDefault(); }
            if(e.key === "Escape") { document.getElementById('viewer').blur(); }
            return;
        }
        if (e.key === "ArrowDown") { sel = (sel + 1) % fs.length; render(); e.preventDefault(); }
        if (e.key === "ArrowUp") { sel = (sel - 1 + fs.length) % fs.length; render(); e.preventDefault(); }
        if (e.key === "Enter" || e.key === "F3") { executeFile(); }
        if (e.key === "F4" && e.shiftKey) { createNewFile(); e.preventDefault(); }
        else if (e.key === "F4") { editMode(); }
        if (e.key === "F7") { createNewDir(); }
        if (e.key === "F8") { deleteFile(); }
    }

    function executeFile() {
        const f = fs[sel];
        const v = document.getElementById('viewer');
        const j = document.getElementById('jitsi-frame');

        if(f.type === 'zip' || f.name.endsWith('.pdf')) {
            alert("Copying file to your local computer...");
            window.open(f.content, '_blank'); // Triggers actual GitHub file download
            return;
        }

        if(f.type === 'exe') {
            v.style.display = 'none'; j.style.display = 'block'; j.src = f.content;
            document.getElementById('view-header').innerText = "RUNNING: " + f.name;
        } else {
            j.style.display = 'none'; v.style.display = 'block'; v.value = f.content || '';
            v.readOnly = true;
            document.getElementById('view-header').innerText = "VIEWING: " + f.name;
        }
    }

    function editMode() {
        const f = fs[sel];
        if(f.protected) {
            alert("ERROR: File is System Protected and cannot be edited.");
            executeFile();
            return;
        }
        if(f.type === 'dir' || f.type === 'exe') return;
        executeFile();
        const v = document.getElementById('viewer');
        v.readOnly = false;
        v.focus();
        document.getElementById('view-header').innerText = "EDITING: " + f.name;
    }

    function createNewFile() {
        let n = prompt("New Filename:");
        if(n) { fs.push({name: n.toUpperCase() + '.txt', content: '', type: 'txt'}); save(); }
    }

    function saveFile() {
        if(fs[sel].protected) return;
        if(fs[sel].type === 'txt') {
            fs[sel].content = document.getElementById('viewer').value;
            save(); 
            alert("SUCCESS: File saved.");
        }
    }

    function createNewDir() {
        let n = prompt("New Directory:");
        if(n) { fs.push({name: n.toUpperCase(), type: 'dir'}); save(); }
    }

    function deleteFile() {
        if(fs[sel].protected) { alert("Access Denied: Cannot delete system files."); return; }
        if(confirm("DELETE " + fs[sel].name + "?")) { fs.splice(sel, 1); sel=0; save(); }
    }

    function showHelp() {
        alert("Instructions:\nF1: Help\nF3: View\nF4: Edit\nShift+F4: New File\nF7: MkDir\nF8: Delete\nF10: Quit");
    }

    function save() { localStorage.setItem('george_vvc_v4', JSON.stringify(fs)); render(); }
    render();
</script>
</body>
</html>
