<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Caucasus Traveler — Test</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1>🌍 Caucasus Traveler</h1>
    <p>Prayer • Food • Places</p>
  </div>
  <button id="locateBtn">📍 Locate me</button>
</header>

<section class="panel">
  <div class="notice" id="locationStatus">Location not requested yet.</div>
  <div class="filters">
    <strong>Show:</strong>
    <label><input type="checkbox" data-layer="mosque" checked> 🕌 Prayer</label>
    <label><input type="checkbox" data-layer="food" checked> 🍴 Food</label>
    <label><input type="checkbox" data-layer="place" checked> ⭐ Places</label>
  </div>
  <div class="filters">
    <strong>Prayer:</strong>
    <label><input type="checkbox" data-filter="toilet"> Toilet</label>
    <label><input type="checkbox" data-filter="wudu"> Wudu</label>
    <label><input type="checkbox" data-filter="wheelchair"> Wheelchair</label>
    <label><input type="checkbox" data-filter="women"> Women's area</label>
    <label><input type="checkbox" data-filter="open"> Open now</label>
  </div>
  <div class="filters">
    <strong>Food:</strong>
    <label><input type="checkbox" data-filter="halal"> Halal</label>
    <label><input type="checkbox" data-filter="porkFree"> Pork-free</label>
    <label><input type="checkbox" data-filter="vegetarian"> Vegetarian</label>
    <label><input type="checkbox" data-filter="cheap"> Cheap</label>
    <label><input type="checkbox" data-filter="atmosphere"> Nice atmosphere</label>
    <label><input type="checkbox" data-filter="delicious"> Very delicious</label>
  </div>
</section>

<div id="map"></div>

<footer>
  <span>Test version • Data is illustrative until you enter verified information.</span>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
